name: Deploy to Vercel (main-concept1)

on:
  push:
    branches:
      - scenario-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --scope haeilylees-projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DUr4OblprLC5Vj13jfHIjOz6
          VERCEL_PROJECT_ID: prj_wEtwy8CYpInZf7GLyNyjgA8ml1rB
