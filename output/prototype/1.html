<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>SKT T Next UX — 시나리오 1</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }

  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 컨트롤 바 ── */
  #controls .preset {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid #d1d5db; background: #f9fafb;
    font-size: 12px; font-weight: 500; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  #controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
  #controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
  #controls .ctrl-div { width: 1px; height: 20px; background: #e5e7eb; }
  #controls input[type=number] {
    width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
  }
  #controls input[type=number]:focus { border-color: #5940df; }
  #controls input[type=number]::-webkit-inner-spin-button,
  #controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  #controls label { color: #6b7280; font-size: 12px; }
  #apply-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #apply-btn:hover { opacity: .85; }

  /* ── 반응형 ── */
  @media (max-width: 767px) {
    body { background: #bacff6; }
    #controls { display: none !important; }
    #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
  }
  @media (min-width: 768px) {
    body {
      padding: 24px 0 48px; background: #c8cdd8;
      display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
    }
    #controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
  }

  /* ── 프레임 ── */
  #frame {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; background: #bacff6;
    width: 375px; height: 812px; border-radius: 40px;
  }
  #ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ── 스크린 (4.html 패턴: display none/block) ── */
  .screen {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: hidden; display: none;
  }
  .screen.active { display: block; }

  /* ── 헤더 버튼 ── */
  .hbtn {
    width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0;
    background: rgba(255,255,255,.4); box-shadow: 0 0 20px rgba(0,0,0,0.05);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; outline: none;
  }

  /* ── S1 배경 마스크 ── */
  #s1-bg {
    position: absolute;
    width: 387.259px; height: 839.554px;
    left: -6.13px; top: -41.28px;
    -webkit-mask-image: url("../../assets/images/scenario1/bg-mask.svg");
    -webkit-mask-size: 375px 867px;
    -webkit-mask-position: 6.129px -13.722px;
    -webkit-mask-repeat: no-repeat;
    mask-image: url("../../assets/images/scenario1/bg-mask.svg");
    mask-size: 375px 867px;
    mask-position: 6.129px -13.722px;
    mask-repeat: no-repeat;
  }
  #s1-bg img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; pointer-events: none; max-width: none;
  }

  /* ── 카드 그라디언트 ── */
  #s1-card-l2 {
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 336.83 140.79' xmlns='http://www.w3.org/2000/svg' preserveAspectRatio='none'%3E%3Crect x='0' y='0' height='100%25' width='100%25' fill='url(%23grad)' opacity='0.7'/%3E%3Cdefs%3E%3CradialGradient id='grad' gradientUnits='userSpaceOnUse' cx='0' cy='0' r='10' gradientTransform='matrix(-3.6737 14.554 -21.93 -5.5014 270.52 20.928)'%3E%3Cstop stop-color='rgba(186,206,255,1)' offset='0'/%3E%3Cstop stop-color='rgba(186,206,255,0)' offset='1'/%3E%3C/radialGradient%3E%3C/defs%3E%3C/svg%3E"),
      linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.4) 100%);
  }

  /* ── iPhone 이미지 (4.html 방식: CSS gradient mask) ── */
  #s1-iphone-wrap {
    position: absolute;
    left: 240px; top: 26px;
    width: 75px; height: 154px;
    overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(155deg, black 45%, transparent 88%);
    mask-image: linear-gradient(155deg, black 45%, transparent 88%);
  }
  #s1-iphone-wrap img {
    position: absolute;
    max-width: none; width: 488px; height: auto;
    left: -192px; top: -60px;
  }

  /* ── DimAi 오버레이 (4.html #s1-dim 패턴) ── */
  #s1-dim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(186,206,246,0.7);
    backdrop-filter: blur(28.626px);
    -webkit-backdrop-filter: blur(28.626px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s ease;
  }
  #s1-dim.open { opacity: 1; pointer-events: auto; }

  /* ── 카드 그룹 (z-50, dim 위) ── */
  #s1-cards {
    position: absolute; z-index: 50;
    left: 19.08px; right: 19.08px; top: 197.55px;
    display: flex; flex-direction: column; gap: 9.542px;
    /* 0.08s 딜레이: GNB 몰핑 시작 후 카드가 뒤따라 상승 */
    transition: transform 0.68s cubic-bezier(0.16, 1, 0.3, 1) 0.08s;
    will-change: transform;
  }

  /* ── 키보드 시트 (4.html #s1-keyboard 패턴) ── */
  #s1-keyboard {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 50;
    transform: translateY(100%);
    transition: transform 0.46s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  #s1-keyboard.open { transform: translateY(0); }

  /* ── 키보드 키 ── */
  .krow { display: flex; gap: 6px; justify-content: center; margin-bottom: 11px; }
  .krow:last-child { margin-bottom: 0; }
  .kkey {
    flex: 1; height: 42px;
    background: #fff; border: none; border-radius: 5px;
    font-size: 17px; font-weight: 400; color: #000;
    cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.35);
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    padding: 0; -webkit-tap-highlight-color: transparent; outline: none;
    user-select: none; -webkit-user-select: none;
  }
  .kkey-sp { background: #AEB5BD; }
  .kkey:active { background: #e0e0e0; }
  .kkey-sp:active { background: #9BA3AB; }

  /* ── 커서 깜빡임 ── */
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .cursor-blink { animation: blink 1.1s step-end infinite; }

  /* ── GNB 몰핑 (디졸브) ── */
  #s1-gnb-wrap { transition: gap 0.5s cubic-bezier(0.16,1,0.3,1); }
  #s1-gnb-benefit {
    overflow: hidden;
    transition: width 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
  }
  #s1-gnb-tap {
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }

  /* ── 터치 힌트 오버레이 ── */
  .tap-hint-overlay {
    position: absolute;
    pointer-events: none;
    z-index: 99999;
    border-radius: 999px;
    border: 2px solid rgba(89, 64, 223, 0.65);
    background: rgba(89, 64, 223, 0.07);
    animation: tap-ring 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1 forwards;
  }
  .tap-hint-overlay--rect { border-radius: 14px; }
  @keyframes tap-ring {
    0%   { opacity: 0; transform: scale(0.94); }
    15%  { opacity: 1; transform: scale(1);    }
    70%  { opacity: 1; transform: scale(1);    }
    100% { opacity: 0; transform: scale(1.03); }
  }
</style>
</head>

          <div class="krow">
            <button class="kkey">ㅂ</button><button class="kkey">ㅈ</button><button class="kkey">ㄷ</button>
            <button class="kkey">ㄱ</button><button class="kkey">ㅅ</button><button class="kkey">ㅛ</button>

            <button class="kkey">ㅔ</button>

          <!-- Row 2: ㅁ ㄴ ㅇ ㄹ ㅎ ㅗ ㅓ ㅏ ㅣ -->

                           display:flex; align-items:center; justify-content:center; padding:0; outline:none;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="9" y="2" width="6" height="11" rx="3" stroke="#3C3C3E" stroke-width="1.5"/>
                <path d="M5 11C5 15.418 8.134 19 12 19C15.866 19 19 15.418 19 11"
                      stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="12" y1="19" x2="12" y2="22" stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>

<script>
/* ── 컨트롤 바 ── */
const frame = document.getElementById('frame');
const presets = document.querySelectorAll('.preset');
const inpW = document.getElementById('inp-w');
const inpH = document.getElementById('inp-h');

function applySize(w, h) {
  frame.style.width  = w + 'px';
  frame.style.height = h + 'px';
  frame.style.borderRadius = Math.round(w * 0.107) + 'px';
}

presets.forEach(btn => {
  btn.addEventListener('click', () => {
    presets.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const w = +btn.dataset.w, h = +btn.dataset.h;
    inpW.value = w; inpH.value = h;
    applySize(w, h);
  });
});

document.getElementById('apply-btn').addEventListener('click', () => {
  applySize(+inpW.value || 375, +inpH.value || 812);
  presets.forEach(b => b.classList.remove('active'));
});

/* ── 반응형 자동 스케일 ── */
(function scaleFrame() {
  const BASE_W = 375, BASE_H = 812;
  function resize() {
    if (window.innerWidth < 768) return;
    const vw = window.innerWidth, vh = window.innerHeight - 120;
    const scale = Math.min(vw * 0.9 / BASE_W, vh / BASE_H, 1.2);
    if (+inpW.value === BASE_W && +inpH.value === BASE_H) {
      frame.style.width  = BASE_W * scale + 'px';
      frame.style.height = BASE_H * scale + 'px';
      frame.style.borderRadius = 40 * Math.min(scale, 1) + 'px';
    }
  }
  window.addEventListener('resize', resize);
  resize();
})();

/* ══ Screen 1 GNB 디졸브 몰핑 + 키보드 ══ */
function showKeyboard() {
  var wrap    = document.getElementById('s1-gnb-wrap');
  var benefit = document.getElementById('s1-gnb-benefit');
  var tap     = document.getElementById('s1-gnb-tap');
  var kb      = document.getElementById('s1-keyboard');
  var cards   = document.getElementById('s1-cards');
  var screen  = document.getElementById('screen-1');

  /* DOM 변경 전에 측정 — 변경 후 읽으면 브라우저가 0 반환하는 타이밍 버그 방지 */
  var screenH  = screen.offsetHeight;
  var kbH      = kb.offsetHeight || 340;   /* 측정 실패 시 fallback */
  var cardsTop = cards.offsetTop;          /* CSS top:197.55px */
  var cardsH   = cards.offsetHeight;

  /* 디졸브 시작 (시각 변화 모두 동시에) */
  document.getElementById('s1-dim').classList.add('open');
  benefit.style.width   = '0';
  benefit.style.opacity = '0';
  wrap.style.gap        = '0';
  tap.style.background = '#fff';
  tap.style.boxShadow  = '0 0 20px rgba(0,0,0,.08)';
  kb.classList.add('open');

  /* 카드 하단이 인풋 필드(키보드 상단) 기준 10px 위에 오도록 계산 */
  var kbTop   = screenH - kbH;
  var ty      = kbTop - 10 - cardsH - 197.55;
  cards.style.transform = 'translateY(' + ty + 'px)';
}

function hideKeyboard() {
  var wrap    = document.getElementById('s1-gnb-wrap');
  var benefit = document.getElementById('s1-gnb-benefit');
  var tap     = document.getElementById('s1-gnb-tap');
  var kb      = document.getElementById('s1-keyboard');
  var dim     = document.getElementById('s1-dim');
  var cards   = document.getElementById('s1-cards');

  /* 1. 키보드 빠르게 퇴장 */
  kb.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 1, 1)';
  kb.classList.remove('open');

  /* 2. 딤을 천천히 걷어내며 screen 1 컨텐츠를 서서히 드러냄 */
  dim.style.transition = 'opacity 0.48s ease';
  dim.classList.remove('open');

  /* 3. 카드 원위치 — 딤이 걷히는 속도에 맞춰 자연스럽게 */
  cards.style.transition = 'transform 0.44s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.08s';
  cards.style.transform  = '';

  /* 4. GNB + 혜택 버튼 — 딤이 반쯤 걷힌 시점에 복원 */
  setTimeout(function() {
    tap.style.background  = 'rgba(255,255,255,0.5)';
    tap.style.boxShadow   = '0 0 19.084px rgba(0,0,0,0.05)';
    benefit.style.width   = '48px';
    benefit.style.opacity = '1';
    wrap.style.gap        = '8px';
  }, 160);

  /* 트랜지션 정리 */
  setTimeout(function() {
    kb.style.transition    = '';
    dim.style.transition   = '';
    cards.style.transition = '';
  }, 600);
}

/* ── 칩 힌트존 클릭 → 키보드 닫기 ── */
document.getElementById('s1-chip-hint-zone').addEventListener('click', function() {
  var kb = document.getElementById('s1-keyboard');
  if (kb.classList.contains('open')) hideKeyboard();
});

/* ── 터치 힌트 ── */
(function() {
  var HINTS = {
    'screen-1': ['s1-gnb-tap'],
  };
  var KEYBOARD_GUARDS = {
    'screen-1': { guard: 's1-keyboard', hints: ['s1-chip-hint-zone'], rect: false },
  };
  var missCount = {};

  function activeScreenId() {
    var s = document.querySelector('.screen.active');
    return s ? s.id : null;
  }

  function showHints(ids, isRect) {
    var stage = document.getElementById('ut-stage');
    var stageRect = stage.getBoundingClientRect();
    ids.forEach(function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      var r = el.getBoundingClientRect();
      var pad = 8;
      var ov = document.createElement('div');
      ov.className = 'tap-hint-overlay' + (isRect ? ' tap-hint-overlay--rect' : '');
      ov.style.left   = (r.left - stageRect.left - pad) + 'px';
      ov.style.top    = (r.top  - stageRect.top  - pad) + 'px';
      ov.style.width  = (r.width  + pad * 2) + 'px';
      ov.style.height = (r.height + pad * 2) + 'px';
      stage.appendChild(ov);
      setTimeout(function() { ov.remove(); }, 1400);
    });
  }

  document.getElementById('ut-stage').addEventListener('pointerdown', function(e) {
    var el = e.target;
    while (el && el !== this) {
      if (el.tagName === 'BUTTON' || el.tagName === 'INPUT' ||
          el.onclick || el.getAttribute('onclick') ||
          el.hasAttribute('onmousedown') || el.hasAttribute('ontouchstart')) {
        return;
      }
      el = el.parentElement;
    }
    var sid = activeScreenId();
    if (!HINTS[sid]) return;
    var hints = HINTS[sid];
    var kg = KEYBOARD_GUARDS[sid];
    var isRect = false;
    if (kg) {
      var guardEl = document.getElementById(kg.guard);
      if (guardEl && guardEl.classList.contains('open')) {
        hints  = kg.hints;
        isRect = !!kg.rect;
      }
    }
    missCount[sid] = (missCount[sid] || 0) + 1;
    if (missCount[sid] >= 2) {
      showHints(hints, isRect);
      missCount[sid] = 0;
    }
  });

  document.getElementById('ut-stage').addEventListener('screenchange', function() {
    missCount = {};
  });
})();
</script>
