<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT T AI (시나리오4)</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ── 컨트롤 바 ── */
#controls .preset {
  padding: 4px 10px; border-radius: 6px;
  border: 1px solid #d1d5db; background: #f9fafb;
  font-size: 12px; font-weight: 500; color: #374151;
  cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
}
#controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
#controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
#controls .div { width: 1px; height: 20px; background: #e5e7eb; }
#controls input[type=number] {
  width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
  font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
}
#controls input[type=number]:focus { border-color: #5940df; }
#controls input[type=number]::-webkit-inner-spin-button,
#controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
#controls label { color: #6b7280; font-size: 12px; }
#apply-btn {
  padding: 4px 12px; border-radius: 6px; border: none;
  background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
#apply-btn:hover { opacity: .85; }

/* ── 반응형 ── */
@media (max-width: 767px) {
  body { background: #d2d4d9; }
  #controls { display: none !important; }
  #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
}
@media (min-width: 768px) {
  body {
    padding: 24px 0 48px; background: #d1d5db;
    display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
  }
  #controls {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
    font-size: 13px; font-weight: 500; color: #374151;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
}

/* ── 프레임 & 스테이지 ── */
#frame {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto; background: #d2d4d9;
}
#ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

/* ── 스크린 ── */
.screen {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: #d2d4d9; overflow: hidden; display: none;
}
.screen.active { display: block; }

/* ── 헤더 버튼 공통 ── */
.hbtn {
  width: 48px; height: 48px; border-radius: 999px;
  background: rgba(255,255,255,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; padding: 0;
}

/* ── GNB ── */
.gnb-wrap {
  position: absolute; left: 0; width: 375px; height: 52px;
  bottom: 34px; z-index: 10;
}
.gnb-search-bg {
  position: absolute; left: 11px; top: 0; width: 293px; height: 52px;
  background: rgba(255,255,255,.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 26px; box-shadow: 0 0 20px rgba(0,0,0,.05);
}
.gnb-search-mask {
  position: absolute; left: 11px; top: 0; width: 293px; height: 52px;
  overflow: hidden; border-radius: 999px;
}
.gnb-input-row {
  position: absolute; left: 20px; top: 15px; width: 221px; height: 22px;
  display: flex; align-items: center; gap: 8px; overflow: hidden;
}
.gnb-input-row img { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
.gnb-input-row span {
  font-size: 16px; font-weight: 500; color: #121212; letter-spacing: -0.64px; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.gnb-mic {
  position: absolute; left: 249px; top: 10px; width: 32px; height: 32px;
  border-radius: 999px; display: flex; align-items: center; justify-content: center;
}
.gnb-active-tab {
  position: absolute; left: 312px; top: 0; width: 52px; height: 52px;
  background: rgba(255,255,255,.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 999px; box-shadow: 0 0 20px rgba(0,0,0,.05);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
</style>
</head>
<body>

<!-- 컨트롤 바 -->
<div id="controls">
  <span>화면 크기</span>
  <button class="preset active" data-w="375" data-h="812">iPhone 14</button>

  <button class="preset" data-w="393" data-h="852">iPhone 16 Pro</button>

<!-- 폰 프레임 -->
<div id="frame" style="width:375px;height:812px;border-radius:44px;">
<div id="ut-stage">

      <!-- Radial gradient overlay (upper-right highlight) -->

      <!-- Text content (left) -->

      <img src="../../assets/images/scenario4/ico-money.png" alt=""

      <span style="font-size:14px;font-weight:500;color:#101010;

  <!-- ── RIMOWA Banner (left=20 top=640 w=335 h=101) ── -->

    <!-- Indicator dots -->

  <!-- ── Bottom Gradient ── -->

              background:linear-gradient(to bottom, rgba(193,193,193,0) 0%, #c1c1c1 50%);
              pointer-events:none;z-index:5;"></div>

</div><!-- /frame -->

<script>
const frame = document.getElementById('frame');
const inpW  = document.getElementById('inp-w');
const inpH  = document.getElementById('inp-h');

document.querySelectorAll('#controls .preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls .preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    inpW.value = btn.dataset.w;
    inpH.value = btn.dataset.h;
    setFrameSize(btn.dataset.w, btn.dataset.h);
  });
});
document.getElementById('apply-btn').addEventListener('click', () => {
  setFrameSize(inpW.value, inpH.value);
});

function setFrameSize(w, h) {
  frame.style.width  = w + 'px';
  frame.style.height = h + 'px';
}

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
