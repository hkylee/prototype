<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT T AI (시나리오4)</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 컨트롤 바 ── */
  #controls .preset {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid #d1d5db; background: #f9fafb;
    font-size: 12px; font-weight: 500; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  #controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
  #controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
  #controls .ctrl-div { width: 1px; height: 20px; background: #e5e7eb; }
  #controls input[type=number] {
    width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
  }
  #controls input[type=number]:focus { border-color: #5940df; }
  #controls input[type=number]::-webkit-inner-spin-button,
  #controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  #controls label { color: #6b7280; font-size: 12px; }
  #apply-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #apply-btn:hover { opacity: .85; }

  /* ── 반응형 ── */
  @media (max-width: 767px) {
    body { background: #d2d4d9; }
    #controls { display: none !important; }
    #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
  }
  @media (min-width: 768px) {
    body {
      padding: 24px 0 48px; background: #d1d5db;
      display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
    }
    #controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
  }

  /* ── 프레임 ── */
  #frame {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; background: #d2d4d9;
  }
  #ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ── 스크린 ── */
  .screen {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: hidden; display: none;
  }
  .screen.active { display: block; }

  /* ── 헤더 버튼 공통 ── */
  .hbtn {
    width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0;
    background: rgba(255,255,255,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; outline: none;
  }

  /* ════════════════════════════════════════
     Rule 2: 딤 오버레이
  ════════════════════════════════════════ */
  #s1-dim {
    position: absolute; inset: 0;
    z-index: 40;
    background: linear-gradient(to bottom, rgba(255,255,255,.55) 0%, rgba(0,0,0,.5) 100%);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.32s ease;
  }
  #s1-dim.open { opacity: 1; pointer-events: auto; }

  /* ════════════════════════════════════════
     Rule 3: 카드 상승 & 키보드 슬라이드업
  ════════════════════════════════════════ */
  #s1-cards {
    transition: transform 0.46s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    transform-origin: top center;
  }
  /* Screen 2: Figma 0.954 scale (border 0.954px / radius 22.9px / font 15.27px) */
  #s1-cards.keyboard-open {
    transform: translateY(-30px) scale(0.954);
    transform-origin: top center;
  }

  #s1-keyboard {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 50;
    transform: translateY(100%);
    transition: transform 0.46s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  #s1-keyboard.open { transform: translateY(0); }

  /* ── 키보드 키 공통 ── */
  .krow { display: flex; gap: 6px; justify-content: center; margin-bottom: 11px; }
  .krow:last-child { margin-bottom: 0; }
  .kkey {
    flex: 1; height: 42px;
    background: #fff; border: none; border-radius: 5px;
    font-size: 17px; font-weight: 400; color: #000;
    cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.35);
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    padding: 0; -webkit-tap-highlight-color: transparent; outline: none;
  }
  .kkey-sp { background: #AEB5BD; }
  .kkey:active { background: #e0e0e0; }
  .kkey-sp:active { background: #9BA3AB; }

  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* ════════════════════════════════════════
     Screen 3: Chat 화면
  ════════════════════════════════════════ */

  /* 채팅 영역 — Figma 9094:14860 top=337.81px 기준 */
  #s3-chat {
    position: absolute; top: 78px; bottom: 0; left: 0; right: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 259px 10px 40px; /* 259 = 337 - 78 (Figma top 맞춤) */
    display: flex; flex-direction: column; gap: 0;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  #s3-chat::-webkit-scrollbar { display: none; }

  /* 메시지 공통: 초기 opacity-0 + translateY(16px) → 진입 시 visible */
  .chat-bubble {
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    will-change: opacity, transform;
  }
  .chat-bubble.visible { opacity: 1; transform: translateY(0); }

  /* AI 스파클 아이콘 펄스 애니메이션 */
  @keyframes ai-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.45; transform: scale(0.88); }
  }
  .ai-icon-pulse { animation: ai-pulse 1.2s ease-in-out infinite; }


  /* Screen 3 헤더 */
  #s3-header {
    position: absolute; top: 0; left: 0; right: 0; height: 72px; z-index: 50;
    padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 6px;
  }

  /* Screen 3 배경 페이드인 */
  #screen-3 { background: #d2d4d9; }
</style>
</head>
<body>

<!-- ── 컨트롤 바 ── -->
<div id="controls">
  <span>화면 크기</span>
  <button class="preset active" data-w="375" data-h="812">iPhone 14</button>
  <button class="preset" data-w="390" data-h="844">iPhone 14 Pro</button>
  <button class="preset" data-w="393" data-h="852">iPhone 16 Pro</button>
  <div class="ctrl-div"></div>
  <label>W <input type="number" id="inp-w" value="375" min="320" max="430"></label>
  <label>H <input type="number" id="inp-h" value="812" min="667" max="932"></label>
  <button id="apply-btn">적용</button>
</div>

<!-- ── 폰 프레임 ── -->
<div id="frame" style="width:375px; height:812px; border-radius:44px;">
<div id="ut-stage">

<!-- ══════════════════════════════════════════
     Screen 1 : T AI 홈
     [4대 레이어 규칙 적용]
     1층(z-0): 배경 콘텐츠 → 딤에 가려짐
     2층(z-40): 딤 오버레이 (backdrop-blur)
     3층(z-50): 헤더·카드·GNB·키보드 → 딤 위에 뜸
══════════════════════════════════════════ -->
<div class="screen active" id="screen-1">
<div style="position:relative; width:100%; height:100%; background:#d2d4d9; overflow:hidden;">

  <!-- ── 헤더 (상태바 없음, top=14px) ── -->
  <div style="position:absolute; left:0; top:14px; width:100%; height:72px; z-index:50;
              display:flex; align-items:center; justify-content:space-between;
              padding:0 20px; box-sizing:border-box;">
    <div style="width:48px; height:48px; flex-shrink:0;"></div>
    <div style="display:flex; align-items:center; gap:6px;">
      <!-- 바코드: Figma 8461:20871 — L브래킷 4개 + 중앙선 -->
      <button class="hbtn" aria-label="바코드">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 4H5C3.895 4 3 4.895 3 6V8" stroke="#101010" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 4H19C20.105 4 21 4.895 21 6V8" stroke="#101010" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 16V18C3 19.105 3.895 20 5 20H8" stroke="#101010" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 16V18C21 19.105 20.105 20 19 20H16" stroke="#101010" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="5" y1="12" x2="19" y2="12" stroke="#101010" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- 장바구니: Figma 8461:20878 — body+handle -->
      <button class="hbtn" aria-label="장바구니">
        <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
          <img src="../../assets/images/scenario4/ico-cart-body.svg" alt=""
               style="position:absolute; left:2px; top:8px; width:20px; height:14px; display:block;">
          <img src="../../assets/images/scenario4/ico-cart-handle.svg" alt=""
               style="position:absolute; left:7px; top:2px; width:10px; height:10.5px; display:block;">
        </div>
      </button>
      <!-- 메뉴: Figma 8461:20884 — 3선 -->
      <button class="hbtn" aria-label="메뉴">
        <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
          <img src="../../assets/images/scenario4/ico-line.svg" alt=""
               style="position:absolute; left:3px; top:5px; width:18px; height:2px; display:block;">
          <img src="../../assets/images/scenario4/ico-line.svg" alt=""
               style="position:absolute; left:3px; top:11px; width:18px; height:2px; display:block;">
          <img src="../../assets/images/scenario4/ico-line.svg" alt=""
               style="position:absolute; left:3px; top:17px; width:18px; height:2px; display:block;">
        </div>
      </button>
    </div>
  </div>

  <!-- ── 인사말 (상태바 없음: top=116) ── -->
  <p style="position:absolute; z-index:0; left:29px; top:116px;
            font-size:26px; font-weight:400; color:#222; line-height:1.25;
            letter-spacing:-1.56px; white-space:nowrap;">
    안녕하세요 지훈님,<br>오랜만이에요
  </p>

  <!-- RIMOWA 배너 (Figma: left=20, top=640, w=335, h=101) -->
  <div style="position:absolute; z-index:0; left:20px; top:640px; width:335px;
              height:101px; border-radius:28px; overflow:hidden;
              background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);">
    <div style="position:absolute; left:28px; top:24px; display:flex; flex-direction:column; gap:4px;">
      <p style="font-size:16px; font-weight:500; color:#101010; line-height:1.2; letter-spacing:-0.48px; white-space:nowrap;">
        어떤 여행에도 어울리는 아이콘
      </p>
      <p style="font-size:12px; font-weight:500; color:#101010; line-height:1.3; opacity:0.7; letter-spacing:-0.48px; white-space:nowrap;">
        RIMOWA 수트케이스
      </p>
    </div>
    <div style="position:absolute; left:28px; top:73px; display:flex; gap:4px; align-items:center;">
      <img src="../../assets/images/scenario4/dot-active.svg"   alt="" style="width:4px; height:4px; display:block;">
      <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
      <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
      <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
    </div>
    <div style="position:absolute; right:0; top:0; width:115px; height:101px; overflow:hidden; pointer-events:none;">
      <img src="../../assets/images/scenario4/banner-rimowa.png" alt=""
           style="position:absolute; right:6px; top:50%; transform:translateY(-50%); height:82%; width:auto; display:block; max-width:none;">
    </div>
  </div>

  <!-- 하단 그라데이션 페이드 -->
  <div style="position:absolute; z-index:5; bottom:0; left:0; right:0; height:140px; pointer-events:none;
              background:linear-gradient(to bottom, rgba(193,193,193,0) 0%, #c1c1c1 50%);"></div>


  <!-- 딤 오버레이 (z-40) -->
  <div id="s1-dim" onclick="hideKeyboard()"></div>

  <!-- 카드 그룹 (z-50, 키보드 열릴 때 -30px 상승) -->
  <div id="s1-cards"
       style="position:absolute; z-index:50; top:202px; left:20px; width:335px;
              display:flex; flex-direction:column; gap:10px;">

    <!-- iPhone 배송 카드 (Figma 9094:10610)
         p-[28px] 균등 / gap-[20px] 텍스트↔버튼 / 이미지 absolute -->
    <div style="position:relative; border-radius:28px; overflow:hidden;
                border:1px solid rgba(255,255,255,0.3);
                background:rgba(255,255,255,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);">
      <!-- 라디얼 그라데이션 오버레이 -->
      <div style="position:absolute; inset:0; pointer-events:none;
                  background:radial-gradient(ellipse at 80% 15%, rgba(174,174,174,0.7) 0%, rgba(209,209,209,0) 60%);"></div>
      <!-- 텍스트 + 버튼 컨테이너: p-[28px] 균등, gap-[20px] -->
      <div style="position:relative; z-index:1; display:flex; flex-direction:column;
                  gap:20px; padding:28px 28px 28px 28px;">
        <!-- 카드 제목 (font-size:16px / font-weight:500 / line-height:1.2 / letter-spacing:-0.48px / color:#101010) -->
        <div style="display:flex; flex-direction:column; line-height:0;">
          <p style="font-size:16px; font-weight:500; color:#101010; line-height:1.2;
                    letter-spacing:-0.48px; margin:0; white-space:nowrap;">민선님, 주문하신</p>
          <p style="font-size:16px; font-weight:500; color:#101010; line-height:1.2;
                    letter-spacing:-0.48px; margin:0; white-space:nowrap;">iPhone20 Pro가 도착했어요</p>
        </div>
        <!-- CTA 버튼 (font-size:14px / font-weight:600 / px-[12px] py-[8px] / line-height:1.3) -->
        <button style="align-self:flex-start; border-radius:999px;
                       font-size:14px; font-weight:600; line-height:1.3;
                       color:#121212; padding:8px 12px;
                       background:rgba(255,255,255,0.5);
                       border:none; cursor:pointer; font-family:inherit; letter-spacing:-0.56px;">
          1분 셀프 개통하기
        </button>
      </div>
      <!-- iPhone 이미지 (Figma 9094:10613)
           container: left=240 top=26 w=75 h=154
           inner img: w=650.28%→488px / left=-255.91%→-192px / top=-38.68%→-60px
           mask: base64 data URI (외부 SVG url(#frag) 참조는 브라우저 mask 컨텍스트에서 실패) -->
      <div style="position:absolute; left:240px; top:26px; width:95px; height:154px;
                  overflow:hidden; pointer-events:none;
                  -webkit-mask-image:url('data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMTQ4IDE0OCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSI2NyIgeTE9Ijc0IiB4Mj0iMTA5LjM3MSIgeTI9IjE1Ny44OTgiIGdyYWRpZW50VW5pdHM9InVzZXJTcGFjZU9uVXNlIj48c3RvcCBzdG9wLWNvbG9yPSIjRDlEOUQ5Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNzM3MzczIiBzdG9wLW9wYWNpdHk9IjAiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTQ4IiBoZWlnaHQ9IjE0OCIgZmlsbD0idXJsKCNnKSIvPjwvc3ZnPg==');
                  mask-image:url('data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgMTQ4IDE0OCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSI2NyIgeTE9Ijc0IiB4Mj0iMTA5LjM3MSIgeTI9IjE1Ny44OTgiIGdyYWRpZW50VW5pdHM9InVzZXJTcGFjZU9uVXNlIj48c3RvcCBzdG9wLWNvbG9yPSIjRDlEOUQ5Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNzM3MzczIiBzdG9wLW9wYWNpdHk9IjAiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTQ4IiBoZWlnaHQ9IjE0OCIgZmlsbD0idXJsKCNnKSIvPjwvc3ZnPg==');
                  -webkit-mask-size:148px 148px; mask-size:148px 148px;
                  -webkit-mask-position:-35px -26px; mask-position:-35px -26px;
                  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;">
        <img src="../../assets/images/scenario4/iphone-card-bg.png" alt=""
             style="position:absolute; max-width:none; width:488px; height:auto; left:-192px; top:-60px;">
      </div>
    </div>

    <!-- 가족 결합 칩 (Figma 9094:10619)
         w-full / pl-[18px] pr-[20px] py-[12px] / gap-[4px] / items-center / rounded-[999px] -->
    <div style="width:100%; display:flex; align-items:center; gap:4px;
                border-radius:999px; cursor:pointer; overflow:hidden;
                background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
                padding:12px 20px 12px 18px;">
      <!-- 아이콘 20×20 / 내부: 15×11.5 at (2.5, 4) -->
      <div style="position:relative; width:20px; height:20px; flex-shrink:0;">
        <img src="../../assets/images/scenario4/ico-family.svg" alt=""
             style="position:absolute; width:15px; height:11.5px; left:2.5px; top:4px; display:block;">
      </div>
      <!-- font-size:14px / font-weight:500 / line-height:1.2 / letter-spacing:-0.42px / color:#101010 -->
      <span style="font-size:14px; font-weight:500; color:#101010; line-height:1.2;
                   white-space:nowrap; letter-spacing:-0.42px;">
        가족 결합 현황 확인해줘
      </span>
    </div>

    <!-- 이번달 요금 칩 (Figma 9094:10622)
         w-full / pl-[18px] pr-[20px] py-[12px] / gap-[4px] / items-center / rounded-[999px] -->
    <div style="width:100%; display:flex; align-items:center; gap:4px;
                border-radius:999px; cursor:pointer; overflow:hidden;
                background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
                padding:12px 20px 12px 18px;">
      <!-- 아이콘 20×20 / 내부: 16×11.5 at (2, 4.75) -->
      <div style="position:relative; width:20px; height:20px; flex-shrink:0;">
        <img src="../../assets/images/scenario4/ico-money.svg" alt=""
             style="position:absolute; width:16px; height:11.5px; left:2px; top:4.75px; display:block;">
      </div>
      <!-- font-size:14px / font-weight:500 / line-height:1.2 / letter-spacing:-0.42px / color:#101010 -->
      <span style="font-size:14px; font-weight:500; color:#101010; line-height:1.2;
                   white-space:nowrap; letter-spacing:-0.42px;">
        이번달 요금이 많이 나온 이유 알려줘
      </span>
    </div>
  </div><!-- /s1-cards -->

  <!-- GNB 검색바 (z-9: 평소엔 콘텐츠 위, 키보드/딤 열리면 뒤로 숨음) -->

<div class="screen" id="screen-3">

<script>
/* ══════════════════════════════════════
   프레임 크기 컨트롤
══════════════════════════════════════ */
const frame = document.getElementById('frame');
const inpW  = document.getElementById('inp-w');
const inpH  = document.getElementById('inp-h');

document.querySelectorAll('#controls .preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls .preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    inpW.value = btn.dataset.w;
    inpH.value = btn.dataset.h;
    setFrameSize(btn.dataset.w, btn.dataset.h);
  });
});
document.getElementById('apply-btn').addEventListener('click', () => {
  setFrameSize(inpW.value, inpH.value);
});
function setFrameSize(w, h) {
  frame.style.width  = w + 'px';
  frame.style.height = h + 'px';
}

/* ══════════════════════════════════════
   화면 전환
══════════════════════════════════════ */
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ══════════════════════════════════════
   Screen 1 ↔ Screen 2 (키보드) 토글
══════════════════════════════════════ */
function showKeyboard() {
  document.getElementById('s1-dim').classList.add('open');
  document.getElementById('s1-keyboard').classList.add('open');
  document.getElementById('s1-cards').classList.add('keyboard-open');
}

function hideKeyboard() {
  document.getElementById('s1-dim').classList.remove('open');
  document.getElementById('s1-keyboard').classList.remove('open');
  document.getElementById('s1-cards').classList.remove('keyboard-open');
  resetTyping();
}

/* ── 한글 키 입력 → 타이핑 상태 ── */
let isTyping = false;

function onKeyPress() {
  if (isTyping) return;
  isTyping = true;
  document.getElementById('s1-cursor-before').style.display = 'none';
  document.getElementById('s1-placeholder').style.display  = 'none';
  document.getElementById('s1-typed').style.display        = 'inline';
  document.getElementById('s1-cursor-after').style.display = 'inline-block';
}

function resetTyping() {
  isTyping = false;
  document.getElementById('s1-cursor-before').style.display = 'inline-block';
  document.getElementById('s1-placeholder').style.display  = 'inline';
  document.getElementById('s1-typed').style.display        = 'none';
  document.getElementById('s1-cursor-after').style.display = 'none';
}

/* ══════════════════════════════════════
   Rule 1: 전송 버튼(return) → Screen 2 → Screen 3 전환
   키보드 + 딤 숨기고 → chat 화면 진입
══════════════════════════════════════ */
function handleSend() {
  if (!isTyping) return; // 텍스트 없으면 무시

  // Step 1: 키보드 + 딤 → 슬라이드다운 + 페이드아웃 (0.46s)
  hideKeyboard();

  // Step 2: 애니메이션이 끝난 직후 Screen 3으로 전환
  setTimeout(() => {
    resetChatArea();
    goTo('screen-3');
    // Step 3: Screen 3 채팅 시퀀스 시작
    startChatAnimation();
  }, 520);
}

/* ── Screen 3 채팅 영역 초기화 ── */
function resetChatArea() {
  document.getElementById('s3-chat').innerHTML = '';
}

/* ══════════════════════════════════════
   Rule 2 + 3 + 4: 채팅 순차 등장 애니메이션
   Helper: addBubble(html, delay)
══════════════════════════════════════ */
function addBubble(html, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const chat = document.getElementById('s3-chat');
      const wrapper = document.createElement('div');
      wrapper.className = 'chat-bubble';
      wrapper.innerHTML = html;
      chat.appendChild(wrapper);

      // Rule 3: 메시지 추가 시마다 스크롤 하단 동기화
      scrollToBottom();

      // 다음 프레임에서 visible 클래스 → CSS Transition 트리거
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          wrapper.classList.add('visible');
          scrollToBottom();
        });
      });

      // transition 끝난 후 resolve
      wrapper.addEventListener('transitionend', () => resolve(wrapper), { once: true });
    }, delay);
  });
}

/* Rule 3: 스크롤 컨테이너 하단으로 스무스 스크롤 */
function scrollToBottom() {
  const chat = document.getElementById('s3-chat');
  if (chat) chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
}

/* ══════════════════════════════════════
   채팅 시퀀스 실행
   0ms   → AI 로딩 아이콘 펄스 (Figma 9094:14864)
   1400ms → 아이콘 제거 후 AI 텍스트 등장 (Figma 9094:14868)
══════════════════════════════════════ */
async function startChatAnimation() {

  /* Step 1: AI 심볼 펄스 (Figma 9094:14864 — 29px 원, 스파클 아이콘) */
  const loadingEl = await addBubble(`
    <div style="padding-left:10px;">
      <div class="ai-icon-pulse"
           style="width:29px; height:29px; border-radius:999px;
                  background:linear-gradient(to bottom, #ffffff, rgba(101,101,101,0));
                  display:flex; align-items:center; justify-content:center; position:relative;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
             style="position:absolute; left:6.5px; top:6.5px;">
          <path d="M8 0.5L9.8 6H15.5L11 9.2L12.8 14.7L8 11.5L3.2 14.7L5 9.2L0.5 6H6.2L8 0.5Z"
                fill="#101010"/>
        </svg>
      </div>
    </div>
  `, 0);

  /* Step 2: 1.4초 후 → AI 텍스트 등장 (Figma 9094:14868 — 22px gradient) */
  setTimeout(() => {
    if (loadingEl) {
      loadingEl.style.transition = 'opacity 0.3s ease';
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.remove(), 300);
    }

    addBubble(`
      <div style="padding-left:10px;">
        <div style="width:29px; height:29px; border-radius:999px; margin-bottom:19px;
                    background:linear-gradient(to bottom, #ffffff, rgba(101,101,101,0));
                    display:flex; align-items:center; justify-content:center; position:relative;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
               style="position:absolute; left:6.5px; top:6.5px;">
            <path d="M8 0.5L9.8 6H15.5L11 9.2L12.8 14.7L8 11.5L3.2 14.7L5 9.2L0.5 6H6.2L8 0.5Z"
                  fill="#101010"/>
          </svg>
        </div>
        <!-- Figma 9094:14868: 22px, Regular, tracking -1.54px, gradient #2f2f2f→#959595 -->
        <p style="font-size:22px; font-weight:400; letter-spacing:-1.54px; line-height:1.3;
                  background:linear-gradient(to right, #2f2f2f 0%, #959595 100%);
                  -webkit-background-clip:text; background-clip:text;
                  -webkit-text-fill-color:transparent; width:318px;">
          어머니께 데이터 선물이 가능한지 확인해볼게요.
        </p>
      </div>
    `, 0);
  }, 1400);
}

/* ══════════════════════════════════════
   뒤로가기: Screen 3 → Screen 1 복귀
══════════════════════════════════════ */
function goBack() {
  resetChatArea();
  resetTyping();
  goTo('screen-1');
}
</script>
