<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT T AI (시나리오4)</title>

<!-- Tailwind CDN (scenario3 환경 동일) -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 컨트롤 바 (scenario3 동일) ── */
  #controls .preset {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid #d1d5db; background: #f9fafb;
    font-size: 12px; font-weight: 500; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  #controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
  #controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
  #controls .ctrl-div { width: 1px; height: 20px; background: #e5e7eb; }
  #controls input[type=number] {
    width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
  }
  #controls input[type=number]:focus { border-color: #5940df; }
  #controls input[type=number]::-webkit-inner-spin-button,
  #controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  #controls label { color: #6b7280; font-size: 12px; }
  #apply-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #apply-btn:hover { opacity: .85; }

  /* ── 반응형 (scenario3 동일) ── */
  @media (max-width: 767px) {
    body { background: #d2d4d9; }
    #controls { display: none !important; }
    #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
  }
  @media (min-width: 768px) {
    body {
      padding: 24px 0 48px; background: #d1d5db;
      display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
    }
    #controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
      font-size: 13px; font-weight: 500; color: #374151;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
  }

  /* ── 프레임 & 스테이지 (scenario3 동일) ── */
  #frame {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; background: #d2d4d9;
  }
  #ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ── 스크린 ── */
  .screen {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: hidden; display: none;
  }
  .screen.active { display: block; }

  /* ── 헤더 버튼 공통 ── */
  .hbtn {
    width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0;
    background: rgba(255,255,255,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; outline: none;
  }
</style>
</head>
<body>

<!-- ── 컨트롤 바 ── -->
<div id="controls">
  <span>화면 크기</span>
  <button class="preset active" data-w="375" data-h="812">iPhone 14</button>
  <button class="preset" data-w="390" data-h="844">iPhone 14 Pro</button>
  <button class="preset" data-w="393" data-h="852">iPhone 16 Pro</button>
  <div class="ctrl-div"></div>
  <label>W <input type="number" id="inp-w" value="375" min="320" max="430"></label>
  <label>H <input type="number" id="inp-h" value="812" min="667" max="932"></label>
  <button id="apply-btn">적용</button>
</div>

<!-- ── 폰 프레임 ── -->
<div id="frame" style="width:375px; height:812px; border-radius:44px;">
<div id="ut-stage">

<!-- ══════════════════════════════════════════
     Screen 1 : T AI 홈 (node 8849-16162)
     [4대 반응형 원칙 적용]
══════════════════════════════════════════ -->
<div class="screen active" id="screen-1">

  <!--
    ┌─────────────────────────────────────────────┐
    │ Rule 1: 최상위 래퍼                          │
    │  w-full max-w-[400px] → 프레임 내에서 유효   │
    │  flex-col으로 수직 흐름 구성                  │
    └─────────────────────────────────────────────┘
  -->
  <div class="w-full h-full max-w-[400px] mx-auto relative flex flex-col overflow-hidden bg-[#d2d4d9]">

    <!-- ────────────────────────────────────────
         Status Bar (Figma: h=54, pt=25, px=24)
         Rule 2: flex justify-between (좌표 배치 금지)
         Rule 3: px-6 패딩, Figma 색상/폰트 그대로
         ※ 아이콘: viewBox 18×22 → img 18×22 1:1, scaleY(-1)은 Figma 원본과 동일
    ─────────────────────────────────────────── -->
    <div class="flex-shrink-0 flex items-start justify-between px-6 h-[54px] pt-[25px]">
      <span class="text-[15px] font-bold text-[#1c1c1e] leading-none">9:41</span>
      <div class="flex items-center gap-[5px]">
        <!-- Figma: -scale-y-100 적용 (SVG bars 방향 보정) -->
        <img src="../../assets/images/scenario4/ico-signal.svg"  alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
        <img src="../../assets/images/scenario4/ico-wifi.svg"    alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
        <img src="../../assets/images/scenario4/ico-battery.svg" alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
      </div>
    </div>

    <!-- ────────────────────────────────────────
         Header (Figma: h=72, top=58 → mt-1 = 4px gap)
         Rule 2: flex justify-between
         Rule 3: px-5, rgba(255,255,255,0.4) 버튼
    ─────────────────────────────────────────── -->
    <div class="flex-shrink-0 flex items-center justify-between px-5 py-3 mt-[4px]">
      <!-- 좌측 빈 영역 (Figma: left area 48×48) -->
      <div class="w-12 h-12 flex-shrink-0"></div>
      <!-- 우측 아이콘 버튼 3개 -->
      <div class="flex items-center gap-[6px]">
        <!-- Barcode -->
        <button class="hbtn" aria-label="바코드">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="3"  y="4"  width="3" height="3" rx="0.5" fill="#101010"/>
            <rect x="18" y="4"  width="3" height="3" rx="0.5" fill="#101010"/>
            <rect x="3"  y="17" width="3" height="3" rx="0.5" fill="#101010"/>
            <rect x="18" y="17" width="3" height="3" rx="0.5" fill="#101010"/>
            <rect x="5"  y="11" width="14" height="2" rx="1"  fill="#101010"/>
          </svg>
        </button>
        <!-- Cart -->
        <button class="hbtn" aria-label="장바구니">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M6.5 9.5H17.5L16 17.5H8L6.5 9.5Z" stroke="#101010" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 9.5V7C9 5.34 10.34 4 12 4C13.66 4 15 5.34 15 7V9.5" stroke="#101010" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Menu -->
        <button class="hbtn" aria-label="메뉴">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <line x1="3" y1="7"  x2="21" y2="7"  stroke="#101010" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3" y1="13" x2="21" y2="13" stroke="#101010" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="3" y1="19" x2="21" y2="19" stroke="#101010" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ────────────────────────────────────────
         Main Content
         Rule 2: flex-1 flex-col justify-between (좌표 금지)
         Rule 4: pb-[71px] — Figma 스펙 정확 계산
           총 가용: 812-54-76=682px
           pb=71 → 실질 682-71=611px
           상단(40+66+20+256)=382 + gap=128 + 배너=101 = 611 ✓
    ─────────────────────────────────────────── -->
    <div class="flex-1 flex flex-col justify-between min-h-0 pb-[71px]">

      <!-- ▷ 상단: 인사말 + 카드 그룹
           Rule 3: px-5(=20px Figma 좌우여백)
           pt-[40px]: Figma top=170, header bottom=130 → 40px gap -->
      <div class="px-5 flex flex-col gap-5 pt-[40px]">

        <!-- 인사말 (Figma: 26px Regular #222 tracking-[-1.56px] lh-1.25) -->
        <p class="text-[26px] font-normal text-[#222222] leading-[1.25]"
           style="letter-spacing:-1.56px;">
          안녕하세요 지훈님,<br>오랜만이에요
        </p>

        <!-- 카드 그룹 (Figma: gap 10px) -->
        <div class="flex flex-col gap-[10px]">

          <!-- ▷ iPhone 배송 카드 (Card/L2)
               Rule 2: 카드 내 이미지는 overflow-hidden으로 클리핑, absolute는 내부 오버레이 용도만
               Rule 3: rounded-[28px], border rgba(255,255,255,0.3), h-[148px] Figma 스펙 -->
          <div class="relative rounded-[28px] overflow-hidden h-[148px] border border-[rgba(255,255,255,0.3)]"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);">

            <!-- 배경 방사형 그라데이션 (Figma: radialGradient 우상단) -->
            <div class="absolute inset-0 pointer-events-none"
                 style="background:radial-gradient(ellipse at 80% 15%, rgba(174,174,174,0.7) 0%, rgba(209,209,209,0) 60%); opacity:1;">
            </div>

            <!-- 텍스트 영역 (좌측) — flex-col justify-between, pr로 이미지 영역 확보 -->
            <div class="relative z-10 flex flex-col justify-between h-full p-7" style="padding-right:130px;">
              <!-- 카드 제목 (Figma: 16px Medium #101010 tracking-[-0.48px] lh-1.2) -->
              <p class="text-[16px] font-medium text-[#101010] leading-[1.2]"
                 style="letter-spacing:-0.48px;">
                민선님, 주문하신<br>iPhone20 Pro가 도착했어요
              </p>
              <!-- CTA 버튼 (Figma: rounded-full, bg rgba(255,255,255,0.5), 14px SemiBold) -->
              <button class="self-start rounded-full text-[14px] font-semibold text-[#121212] leading-[1.3] whitespace-nowrap px-3 py-2"
                      style="background:rgba(255,255,255,0.5); font-family:inherit; border:none; cursor:pointer; letter-spacing:-0.56px;">
                1분 셀프 개통하기
              </button>
            </div>

            <!-- 아이폰 이미지 (우측 클리핑 영역) -->
            <div class="absolute right-0 top-0 w-[148px] h-[148px] overflow-hidden">
              <img src="../../assets/images/scenario4/iphone-card-bg.png" alt=""
                   class="absolute max-w-none"
                   style="top:-30px; left:-192px; width:488px; height:auto; pointer-events:none;">
            </div>
          </div>

          <!-- ▷ 제안 칩: 가족 결합 현황
               Figma: 외부 컨테이너 20×20, 내부 이미지 w=15 h=11.5 at left=2.5 top=4
               Rule 3: padding:12px 20px 12px 18px, 14px Medium -->
          <div class="flex items-center gap-[4px] rounded-full cursor-pointer"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:12px 20px 12px 18px;">
            <!-- 아이콘 컨테이너 20×20, 내부 이미지 정확한 오프셋 배치 -->
            <div class="relative flex-shrink-0" style="width:20px; height:20px;">
              <img src="../../assets/images/scenario4/ico-family.svg" alt=""
                   style="position:absolute; width:15px; height:11.5px; left:2.5px; top:4px; display:block;">
            </div>
            <span class="text-[14px] font-medium text-[#101010] leading-[1.2] whitespace-nowrap"
                  style="letter-spacing:-0.42px;">
              가족 결합 현황 확인해줘
            </span>
          </div>

          <!-- ▷ 제안 칩: 이번달 요금
               Figma: 외부 컨테이너 20×20, 내부 이미지 w=16 h=11.5 at left=2 top=4.75 -->
          <div class="flex items-center gap-[4px] rounded-full cursor-pointer"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:12px 20px 12px 18px;">
            <div class="relative flex-shrink-0" style="width:20px; height:20px;">
              <img src="../../assets/images/scenario4/ico-money.svg" alt=""
                   style="position:absolute; width:16px; height:11.5px; left:2px; top:4.75px; display:block;">
            </div>
            <span class="text-[14px] font-medium text-[#101010] leading-[1.2] whitespace-nowrap"
                  style="letter-spacing:-0.42px;">
              이번달 요금이 많이 나온 이유 알려줘
            </span>
          </div>

        </div><!-- /카드 그룹 -->
      </div><!-- /상단 -->

      <!-- ▷ 하단: RIMOWA 배너
           Rule 2: justify-between으로 자연스럽게 하단 배치
           Rule 3: Figma 스펙 — left=20, h=101, rounded-28px, bg rgba(255,255,255,0.2)
                   텍스트 left=28, top=24 | 닷 left=28, top=73 | 이미지 right=268(배너내) -->
      <div class="mx-5 relative rounded-[28px] overflow-hidden h-[101px]"
           style="background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);">
        <!-- 배너 텍스트 (Figma: left=28, top=24) -->
        <div class="flex flex-col gap-1 absolute" style="left:28px; top:24px;">
          <p class="text-[16px] font-medium text-[#101010] leading-[1.2]" style="letter-spacing:-0.48px;">
            어떤 여행에도 어울리는 아이콘
          </p>
          <p class="text-[12px] font-medium text-[#101010] leading-[1.3] opacity-70" style="letter-spacing:-0.48px;">
            RIMOWA 수트케이스
          </p>
        </div>
        <!-- 인디케이터 닷 (Figma: left=28, top=73, w=4px, gap=4px) -->
        <div class="flex items-center absolute" style="left:28px; top:73px; gap:4px;">
          <img src="../../assets/images/scenario4/dot-active.svg"   alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
        </div>
        <!-- 수트케이스 이미지 (Figma: x=268, y=23, w=47.4, h=61.9 / 배너 내 우측) -->
        <div class="absolute overflow-hidden" style="right:0; top:0; width:110px; height:101px;">
          <img src="../../assets/images/scenario4/banner-rimowa.png" alt=""
               class="absolute h-full w-auto object-contain" style="right:8px; top:0;">
        </div>
      </div>

    </div><!-- /Main Content -->

    <!-- ────────────────────────────────────────
         하단 그라데이션 오버레이
         (Rule 4 예외: 시각 오버레이이므로 absolute 허용)
         Rule 3: Figma 그라데이션 100% 동일
    ─────────────────────────────────────────── -->
    <div class="absolute bottom-0 left-0 right-0 h-[140px] pointer-events-none z-[5]"
         style="background:linear-gradient(to bottom, rgba(193,193,193,0) 0%, #c1c1c1 50%);">
    </div>

    <!-- ────────────────────────────────────────
         GNB 바
         Rule 4: 하단 고정 → absolute bottom-[34px] (프레임 내)
         Rule 3: Figma 스펙 그대로 (배경/blur/border-radius)
    ─────────────────────────────────────────── -->
    <div class="absolute bottom-[34px] left-0 right-0 h-[52px] z-10">

      <!-- 검색바 배경 (Figma: left=11, w=293, h=52, rounded-26) -->
      <div class="absolute left-[11px] top-0 w-[293px] h-[52px] rounded-[26px]"
           style="background:rgba(255,255,255,0.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 0 20px rgba(0,0,0,0.05);">
      </div>

      <!-- 검색바 입력 오버레이 -->
      <div class="absolute left-[11px] top-0 w-[293px] h-[52px] overflow-hidden rounded-full">
        <!-- 검색 아이콘 + 플레이스홀더 (Figma: left=20, top=15, w=221, h=22) -->
        <div class="absolute flex items-center gap-2 h-[22px] overflow-hidden"
             style="left:20px; top:15px; width:221px;">
          <!-- GNB 검색 아이콘: viewBox 16×16 → 16×16 표시 -->
          <img src="../../assets/images/scenario4/ico-gnb-search.svg" alt=""
               style="width:16px; height:16px; display:block; flex-shrink:0;">
          <span class="text-[16px] font-medium text-[#121212] leading-[1.4] whitespace-nowrap overflow-hidden text-ellipsis flex-1"
                style="letter-spacing:-0.64px;">
            T에 대해 무엇이든 물어보세요
          </span>
        </div>
        <!-- 마이크 버튼 (Figma: left=249, top=10, 외부 24×24 컨테이너, 내부 mic 14×14 at left=5 top=5) -->
        <div class="absolute rounded-full" style="left:249px; top:10px; width:32px; height:32px;">
          <img src="../../assets/images/scenario4/ico-gnb-mic.svg" alt=""
               style="position:absolute; width:14px; height:14px; left:5px; top:5px; display:block;">
        </div>
      </div>

      <!-- 활성 탭 혜택 (Figma: left=312, w=52, h=52, rounded-full, 아이콘 24×24 center) -->
      <div class="absolute top-0 rounded-full overflow-hidden flex items-center justify-center"
           style="left:312px; width:52px; height:52px; background:rgba(255,255,255,0.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 0 20px rgba(0,0,0,0.05);">
        <!-- GNB active icon: viewBox 24×24 → 24×24 표시 -->
        <img src="../../assets/images/scenario4/ico-gnb-active.svg" alt=""
             style="width:24px; height:24px; display:block;">
      </div>

    </div><!-- /GNB -->

  </div><!-- /Rule 1 최상위 래퍼 -->
</div><!-- /screen-1 -->

</div><!-- /ut-stage -->
</div><!-- /frame -->

<script>
/* ── 프레임 크기 컨트롤 ── */
const frame = document.getElementById('frame');
const inpW  = document.getElementById('inp-w');
const inpH  = document.getElementById('inp-h');

document.querySelectorAll('#controls .preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls .preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    inpW.value = btn.dataset.w;
    inpH.value = btn.dataset.h;
    setFrameSize(btn.dataset.w, btn.dataset.h);
  });
});
document.getElementById('apply-btn').addEventListener('click', () => {
  setFrameSize(inpW.value, inpH.value);
});
function setFrameSize(w, h) {
  frame.style.width  = w + 'px';
  frame.style.height = h + 'px';
}

/* ── 화면 전환 (다음 화면 추가 시 사용) ── */
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
