<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT T AI (시나리오4)</title>

<!-- Tailwind CDN (scenario3 환경 동일) -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 컨트롤 바 (scenario3 동일) ── */
  #controls .preset {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid #d1d5db; background: #f9fafb;
    font-size: 12px; font-weight: 500; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  #controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
  #controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
  #controls .ctrl-div { width: 1px; height: 20px; background: #e5e7eb; }
  #controls input[type=number] {
    width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
  }
  #controls input[type=number]:focus { border-color: #5940df; }
  #controls input[type=number]::-webkit-inner-spin-button,
  #controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  #controls label { color: #6b7280; font-size: 12px; }
  #apply-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #apply-btn:hover { opacity: .85; }

  /* ── 반응형 (scenario3 동일) ── */
  @media (max-width: 767px) {
    body { background: #d2d4d9; }
    #controls { display: none !important; }
    #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
  }
  @media (min-width: 768px) {
    body {
      padding: 24px 0 48px; background: #d1d5db;
      display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
    }
    #controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
      font-size: 13px; font-weight: 500; color: #374151;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
  }

  /* ── 프레임 & 스테이지 (scenario3 동일) ── */
  #frame {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; background: #d2d4d9;
  }
  #ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* ── 스크린 ── */
  .screen {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: hidden; display: none;
  }
  .screen.active { display: block; }

  /* ── 헤더 버튼 공통 ── */
  .hbtn {
    width: 48px; height: 48px; border-radius: 999px; flex-shrink: 0;
    background: rgba(255,255,255,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; outline: none;
  }

  /* ════════════════════════════════════════
     딤 오버레이 & 키보드 바텀 시트
  ════════════════════════════════════════ */
  #s1-dim {
    position: absolute; inset: 0; z-index: 20;
    background: linear-gradient(to bottom, rgba(255,255,255,.55) 0%, rgba(0,0,0,.5) 100%);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #s1-dim.open { opacity: 1; pointer-events: auto; }

  #s1-keyboard {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
    transform: translateY(100%);
    transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #s1-keyboard.open { transform: translateY(0); }

  /* ── 키보드 키 공통 ── */
  .krow { display: flex; gap: 6px; justify-content: center; margin-bottom: 11px; }
  .krow:last-child { margin-bottom: 0; }
  .kkey {
    flex: 1; height: 42px;
    background: #fff; border: none; border-radius: 5px;
    font-size: 17px; font-weight: 400; color: #000; text-align: center;
    cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.35);
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    padding: 0; -webkit-tap-highlight-color: transparent; outline: none;
  }
  .kkey-sp { background: #AEB5BD; }
  .kkey:active { background: #e0e0e0; }
  .kkey-sp:active { background: #9BA3AB; }

  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* ── 메인 콘텐츠: 딤(z-20) 위에 항상 떠 있음 ── */
  #s1-content {
    position: relative;
    z-index: 25;
    transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #s1-content.keyboard-open {
    transform: translateY(-30px);
  }
</style>
</head>
<body>

<!-- ── 컨트롤 바 ── -->
<div id="controls">
  <span>화면 크기</span>
  <button class="preset active" data-w="375" data-h="812">iPhone 14</button>
  <button class="preset" data-w="390" data-h="844">iPhone 14 Pro</button>
  <button class="preset" data-w="393" data-h="852">iPhone 16 Pro</button>
  <div class="ctrl-div"></div>
  <label>W <input type="number" id="inp-w" value="375" min="320" max="430"></label>
  <label>H <input type="number" id="inp-h" value="812" min="667" max="932"></label>
  <button id="apply-btn">적용</button>
</div>

<!-- ── 폰 프레임 ── -->
<div id="frame" style="width:375px; height:812px; border-radius:44px;">
<div id="ut-stage">

<!-- ══════════════════════════════════════════
     Screen 1 : T AI 홈 (node 8849-16162)
     [4대 반응형 원칙 적용]
══════════════════════════════════════════ -->
<div class="screen active" id="screen-1">

  <!--
    ┌─────────────────────────────────────────────┐
    │ Rule 1: 최상위 래퍼                          │
    │  w-full max-w-[400px] → 프레임 내에서 유효   │
    │  flex-col으로 수직 흐름 구성                  │
    └─────────────────────────────────────────────┘
  -->
  <div class="w-full h-full max-w-[400px] mx-auto relative flex flex-col overflow-hidden bg-[#d2d4d9]">

    <!-- ────────────────────────────────────────
         Status Bar (Figma: h=54, pt=25, px=24)
         Rule 2: flex justify-between (좌표 배치 금지)
         Rule 3: px-6 패딩, Figma 색상/폰트 그대로
         ※ 아이콘: viewBox 18×22 → img 18×22 1:1, scaleY(-1)은 Figma 원본과 동일
    ─────────────────────────────────────────── -->
    <div class="flex-shrink-0 flex items-start justify-between px-6 h-[54px] pt-[25px]">
      <span class="text-[15px] font-bold text-[#1c1c1e] leading-none">9:41</span>
      <div class="flex items-center gap-[5px]">
        <!-- Figma: -scale-y-100 적용 (SVG bars 방향 보정) -->
        <img src="../../assets/images/scenario4/ico-signal.svg"  alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
        <img src="../../assets/images/scenario4/ico-wifi.svg"    alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
        <img src="../../assets/images/scenario4/ico-battery.svg" alt="" style="width:18px; height:22px; display:block; transform:scaleY(-1);">
      </div>
    </div>

    <!-- ────────────────────────────────────────
         Header (Figma: h=72, top=58 → mt-1 = 4px gap)
         Rule 2: flex justify-between
         Rule 3: px-5, rgba(255,255,255,0.4) 버튼
    ─────────────────────────────────────────── -->
    <div class="flex-shrink-0 flex items-center justify-between px-5 py-3 mt-[4px]"
         style="position:relative; z-index:25;">
      <!-- 좌측 빈 영역 (Figma: left area 48×48) -->
      <div class="w-12 h-12 flex-shrink-0"></div>
      <!-- 우측 아이콘 버튼 3개 -->
      <div class="flex items-center gap-[6px]">
        <!-- Barcode: Figma 8461:20871 — 4 bracket corners + center bar -->
        <button class="hbtn" aria-label="바코드">
          <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
            <!-- TL corner (viewBox 6×5): left=2, top=3 -->
            <img src="../../assets/images/scenario4/ico-barcode-tl.svg" alt=""
                 style="position:absolute; left:2px; top:3px; width:6px; height:5px; display:block;">
            <!-- TR corner (viewBox 5×6): right edge -->
            <img src="../../assets/images/scenario4/ico-barcode-tr.svg" alt=""
                 style="position:absolute; left:16px; top:3px; width:5px; height:6px; display:block;">
            <!-- BL corner (viewBox 5×6): bottom-left -->
            <img src="../../assets/images/scenario4/ico-barcode-bl.svg" alt=""
                 style="position:absolute; left:2px; top:15px; width:5px; height:6px; display:block;">
            <!-- BR corner (viewBox 6×5): bottom-right -->
            <img src="../../assets/images/scenario4/ico-barcode-br.svg" alt=""
                 style="position:absolute; left:16px; top:16px; width:6px; height:5px; display:block;">
            <!-- center bar: left=5, top=11, width=14, height=2 -->
            <div style="position:absolute; background:#101010; height:2px; left:5px; width:14px; border-radius:999px; top:11px;"></div>
          </div>
        </button>
        <!-- Cart: Figma 8461:20878 — body + handle -->
        <button class="hbtn" aria-label="장바구니">
          <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
            <!-- body (viewBox 19.735×14): centered x, top=8, 20×14 display -->
            <img src="../../assets/images/scenario4/ico-cart-body.svg" alt=""
                 style="position:absolute; left:2px; top:8px; width:20px; height:14px; display:block;">
            <!-- handle (viewBox 10×10.5): left=7, top=2, 10×10.5 display -->
            <img src="../../assets/images/scenario4/ico-cart-handle.svg" alt=""
                 style="position:absolute; left:7px; top:2px; width:10px; height:10.5px; display:block;">
          </div>
        </button>
        <!-- Menu: Figma 8461:20884 — 3 lines (ico-line.svg ×3) -->
        <button class="hbtn" aria-label="메뉴">
          <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
            <!-- line 1: container top=7, inset-top=-2 → display top=5 -->
            <img src="../../assets/images/scenario4/ico-line.svg" alt=""
                 style="position:absolute; left:3px; top:5px; width:18px; height:2px; display:block;">
            <!-- line 2: container top=13 → display top=11 -->
            <img src="../../assets/images/scenario4/ico-line.svg" alt=""
                 style="position:absolute; left:3px; top:11px; width:18px; height:2px; display:block;">
            <!-- line 3: container top=19 → display top=17 -->
            <img src="../../assets/images/scenario4/ico-line.svg" alt=""
                 style="position:absolute; left:3px; top:17px; width:18px; height:2px; display:block;">
          </div>
        </button>
      </div>
    </div>

    <!-- ────────────────────────────────────────
         Main Content
         Rule 2: flex-1 flex-col justify-between (좌표 금지)
         Rule 4: pb-[71px] — Figma 스펙 정확 계산
           총 가용: 812-54-76=682px
           pb=71 → 실질 682-71=611px
           상단(40+66+20+256)=382 + gap=128 + 배너=101 = 611 ✓
    ─────────────────────────────────────────── -->
    <div id="s1-content" class="flex-1 flex flex-col justify-between min-h-0 pb-[71px]">

      <!-- ▷ 상단: 인사말 + 카드 그룹
           Rule 3: px-5(=20px Figma 좌우여백)
           pt-[40px]: Figma top=170, header bottom=130 → 40px gap -->
      <div class="px-5 flex flex-col gap-5 pt-[40px]">

        <!-- 인사말 (Figma: 26px Regular #222 tracking-[-1.56px] lh-1.25) -->
        <p class="text-[26px] font-normal text-[#222222] leading-[1.25]"
           style="letter-spacing:-1.56px;">
          안녕하세요 지훈님,<br>오랜만이에요
        </p>

        <!-- 카드 그룹 (Figma: gap 10px) -->
        <div class="flex flex-col gap-[10px]">

          <!-- ▷ iPhone 배송 카드 (Card/L2)
               Rule 2: 카드 내 이미지는 overflow-hidden으로 클리핑, absolute는 내부 오버레이 용도만
               Rule 3: rounded-[28px], border rgba(255,255,255,0.3), h-[148px] Figma 스펙 -->
          <div class="relative rounded-[28px] overflow-hidden h-[148px] border border-[rgba(255,255,255,0.3)]"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);">

            <!-- 배경 방사형 그라데이션 (Figma: radialGradient 우상단) -->
            <div class="absolute inset-0 pointer-events-none"
                 style="background:radial-gradient(ellipse at 80% 15%, rgba(174,174,174,0.7) 0%, rgba(209,209,209,0) 60%); opacity:1;">
            </div>

            <!-- 텍스트 영역 (좌측) — flex-col justify-between, pr로 이미지 영역 확보 -->
            <div class="relative z-10 flex flex-col justify-between h-full p-7" style="padding-right:130px;">
              <!-- 카드 제목 (Figma: 16px Medium #101010 tracking-[-0.48px] lh-1.2) -->
              <p class="text-[16px] font-medium text-[#101010] leading-[1.2]"
                 style="letter-spacing:-0.48px;">
                민선님, 주문하신<br>iPhone20 Pro가 도착했어요
              </p>
              <!-- CTA 버튼 (Figma: rounded-full, bg rgba(255,255,255,0.5), 14px SemiBold) -->
              <button class="self-start rounded-full text-[14px] font-semibold text-[#121212] leading-[1.3] whitespace-nowrap px-3 py-2"
                      style="background:rgba(255,255,255,0.5); font-family:inherit; border:none; cursor:pointer; letter-spacing:-0.56px;">
                1분 셀프 개통하기
              </button>
            </div>

            <!-- 아이폰 이미지 (우측 클리핑 영역) -->
            <div class="absolute right-0 top-0 w-[148px] h-[148px] overflow-hidden">
              <img src="../../assets/images/scenario4/iphone-card-bg.png" alt=""
                   class="absolute max-w-none"
                   style="top:-30px; left:-192px; width:488px; height:auto; pointer-events:none;">
            </div>
          </div>

          <!-- ▷ 제안 칩: 가족 결합 현황
               Figma: 외부 컨테이너 20×20, 내부 이미지 w=15 h=11.5 at left=2.5 top=4
               Rule 3: padding:12px 20px 12px 18px, 14px Medium -->
          <div class="flex items-center gap-[4px] rounded-full cursor-pointer"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:12px 20px 12px 18px;">
            <!-- 아이콘 컨테이너 20×20, 내부 이미지 정확한 오프셋 배치 -->
            <div class="relative flex-shrink-0" style="width:20px; height:20px;">
              <img src="../../assets/images/scenario4/ico-family.svg" alt=""
                   style="position:absolute; width:15px; height:11.5px; left:2.5px; top:4px; display:block;">
            </div>
            <span class="text-[14px] font-medium text-[#101010] leading-[1.2] whitespace-nowrap"
                  style="letter-spacing:-0.42px;">
              가족 결합 현황 확인해줘
            </span>
          </div>

          <!-- ▷ 제안 칩: 이번달 요금
               Figma: 외부 컨테이너 20×20, 내부 이미지 w=16 h=11.5 at left=2 top=4.75 -->
          <div class="flex items-center gap-[4px] rounded-full cursor-pointer"
               style="background:rgba(255,255,255,0.4); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:12px 20px 12px 18px;">
            <div class="relative flex-shrink-0" style="width:20px; height:20px;">
              <img src="../../assets/images/scenario4/ico-money.svg" alt=""
                   style="position:absolute; width:16px; height:11.5px; left:2px; top:4.75px; display:block;">
            </div>
            <span class="text-[14px] font-medium text-[#101010] leading-[1.2] whitespace-nowrap"
                  style="letter-spacing:-0.42px;">
              이번달 요금이 많이 나온 이유 알려줘
            </span>
          </div>

        </div><!-- /카드 그룹 -->
      </div><!-- /상단 -->

      <!-- ▷ 하단: RIMOWA 배너
           Rule 2: justify-between으로 자연스럽게 하단 배치
           Rule 3: Figma 스펙 — left=20, h=101, rounded-28px, bg rgba(255,255,255,0.2)
                   텍스트 left=28, top=24 | 닷 left=28, top=73 | 이미지 right=268(배너내) -->
      <div class="mx-5 relative rounded-[28px] overflow-hidden h-[101px]"
           style="background:rgba(255,255,255,0.2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);">
        <!-- 배너 텍스트 (Figma: left=28, top=24) -->
        <div class="flex flex-col gap-1 absolute" style="left:28px; top:24px;">
          <p class="text-[16px] font-medium text-[#101010] leading-[1.2]" style="letter-spacing:-0.48px;">
            어떤 여행에도 어울리는 아이콘
          </p>
          <p class="text-[12px] font-medium text-[#101010] leading-[1.3] opacity-70" style="letter-spacing:-0.48px;">
            RIMOWA 수트케이스
          </p>
        </div>
        <!-- 인디케이터 닷 (Figma: left=28, top=73, w=4px, gap=4px) -->
        <div class="flex items-center absolute" style="left:28px; top:73px; gap:4px;">
          <img src="../../assets/images/scenario4/dot-active.svg"   alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
          <img src="../../assets/images/scenario4/dot-inactive.svg" alt="" style="width:4px; height:4px; display:block;">
        </div>
        <!-- 수트케이스 이미지 (Figma: x=268, y=23, w=47.4, h=61.9 / 배너 내 우측) -->
        <div class="absolute overflow-hidden" style="right:0; top:0; width:110px; height:101px;">
          <img src="../../assets/images/scenario4/banner-rimowa.png" alt=""
               class="absolute h-full w-auto object-contain" style="right:8px; top:0;">
        </div>
      </div>

    </div><!-- /Main Content -->

    <!-- ────────────────────────────────────────
         하단 그라데이션 오버레이
         (Rule 4 예외: 시각 오버레이이므로 absolute 허용)
         Rule 3: Figma 그라데이션 100% 동일
    ─────────────────────────────────────────── -->
    <div class="absolute bottom-0 left-0 right-0 h-[140px] pointer-events-none z-[5]"
         style="background:linear-gradient(to bottom, rgba(193,193,193,0) 0%, #c1c1c1 50%);">
    </div>

    <!-- ────────────────────────────────────────
         GNB 바
         Rule 4: 하단 고정 → absolute bottom-[34px] (프레임 내)
         Rule 3: Figma 스펙 그대로 (배경/blur/border-radius)
    ─────────────────────────────────────────── -->
    <div class="absolute bottom-[34px] left-0 right-0 h-[52px] z-10">

      <!-- 검색바 배경 (Figma: left=11, w=293, h=52, rounded-26) -->
      <div class="absolute left-[11px] top-0 w-[293px] h-[52px] rounded-[26px]"
           style="background:rgba(255,255,255,0.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:0 0 20px rgba(0,0,0,0.05);">
      </div>

      <!-- 검색바 입력 오버레이 -->
      <div class="absolute left-[11px] top-0 w-[293px] h-[52px] overflow-hidden rounded-full"
           onclick="showKeyboard()" style="cursor:pointer;">
        <!-- 검색 아이콘 + 플레이스홀더 (Figma: left=20, top=15, w=221, h=22) -->
        <div class="absolute flex items-center gap-2 h-[22px] overflow-hidden"
             style="left:20px; top:15px; width:221px;">
          <!-- GNB 검색 아이콘: viewBox 16×16 → 16×16 표시 -->
          <img src="../../assets/images/scenario4/ico-gnb-search.svg" alt=""
               style="width:16px; height:16px; display:block; flex-shrink:0;">
          <span class="text-[16px] font-medium text-[#121212] leading-[1.4] whitespace-nowrap overflow-hidden text-ellipsis flex-1"

        </div>
        <!-- 마이크 버튼 (Figma: left=249, top=10, 외부 24×24 컨테이너, 내부 mic 14×14 at left=5 top=5) -->
        <div class="absolute rounded-full" style="left:249px; top:10px; width:32px; height:32px;">

    <!-- ════════════════════════════════════════

    ════════════════════════════════════════ -->

    <!-- ════════════════════════════════════════
         키보드 바텀 시트
         Figma node 8908-10323 기반
         슬라이드업 + 입력바 포함
    ════════════════════════════════════════ -->
    <div id="s1-keyboard">

                    box-shadow:0 0 20px rgba(0,0,0,.08); border:1px solid rgba(255,255,255,.8);">

                      display:flex; align-items:center; gap:6px; max-width:270px; overflow:hidden;">

                 style="width:16px; height:16px; flex-shrink:0; display:block;">

                  style="display:inline-block; width:1.5px; height:20px; background:#3617ce;
                         flex-shrink:0; animation:blink 1s step-end infinite;"></span>

                  style="font-size:16px; font-weight:500; color:rgba(0,0,0,.3);
                         white-space:nowrap; letter-spacing:-0.64px; font-family:inherit;">
              T에 대해 무엇이든 물어보세요
            </span>
            <!-- 타이핑 후 상태 (Figma 8908:10774) -->
            <span id="s1-typed"
                  style="display:none; font-size:16px; font-weight:500; color:#000;
                         white-space:nowrap; letter-spacing:-0.64px; font-family:inherit;">
              엄마에게 데이터를 선물하고 싶어
            </span>
            <span id="s1-cursor-after"
                  style="display:none; width:1.5px; height:20px; background:#3617ce;
                         flex-shrink:0; animation:blink 1s step-end infinite;"></span>
          </div>
          <!-- 마이크 아이콘 -->
          <div style="position:absolute; right:11px; top:50%; transform:translateY(-50%);
                      width:32px; height:32px; display:flex; align-items:center; justify-content:center;">
            <img src="../../assets/images/scenario4/ico-gnb-mic.svg" alt=""
                 style="width:14px; height:14px; display:block;">
          </div>
        </div>
      </div>

      <!-- 키보드 배경 (Figma: #e6e9ed, rounded-tl/tr-24px) -->
      <div style="background:#e6e9ed; border-radius:24px 24px 0 0; padding:11px 4px 0; overflow:hidden;">

        <!-- Row 1 : ㅂ ㅈ ㄷ ㄱ ㅅ ㅛ ㅕ ㅑ ㅐ ㅔ -->
        <div class="krow">
          <button class="kkey" onclick="onKeyPress()">ㅂ</button><button class="kkey" onclick="onKeyPress()">ㅈ</button><button class="kkey" onclick="onKeyPress()">ㄷ</button>
          <button class="kkey" onclick="onKeyPress()">ㄱ</button><button class="kkey" onclick="onKeyPress()">ㅅ</button><button class="kkey" onclick="onKeyPress()">ㅛ</button>
          <button class="kkey" onclick="onKeyPress()">ㅕ</button><button class="kkey" onclick="onKeyPress()">ㅑ</button><button class="kkey" onclick="onKeyPress()">ㅐ</button>
          <button class="kkey" onclick="onKeyPress()">ㅔ</button>
        </div>

        <!-- Row 2 : ㅁ ㄴ ㅇ ㄹ ㅎ ㅗ ㅓ ㅏ ㅣ (9개, 중앙 정렬) -->
        <div class="krow" style="padding:0 17px;">
          <button class="kkey" onclick="onKeyPress()">ㅁ</button><button class="kkey" onclick="onKeyPress()">ㄴ</button><button class="kkey" onclick="onKeyPress()">ㅇ</button>
          <button class="kkey" onclick="onKeyPress()">ㄹ</button><button class="kkey" onclick="onKeyPress()">ㅎ</button><button class="kkey" onclick="onKeyPress()">ㅗ</button>
          <button class="kkey" onclick="onKeyPress()">ㅓ</button><button class="kkey" onclick="onKeyPress()">ㅏ</button><button class="kkey" onclick="onKeyPress()">ㅣ</button>
        </div>

        <!-- Row 3 : ⇧ ㅋ ㅌ ㅊ ㅍ ㅠ ㅜ ㅡ ⌫ -->
        <div class="krow">
          <button class="kkey kkey-sp" style="flex:0 0 44px;">
            <svg width="16" height="14" viewBox="0 0 20 16" fill="none">
              <path d="M10 1L1 10H6.5V15H13.5V10H19L10 1Z" fill="#3C3C3E"/>
            </svg>
          </button>
          <button class="kkey" onclick="onKeyPress()">ㅋ</button><button class="kkey" onclick="onKeyPress()">ㅌ</button><button class="kkey" onclick="onKeyPress()">ㅊ</button>
          <button class="kkey" onclick="onKeyPress()">ㅍ</button><button class="kkey" onclick="onKeyPress()">ㅠ</button><button class="kkey" onclick="onKeyPress()">ㅜ</button>
          <button class="kkey" onclick="onKeyPress()">ㅡ</button>
          <button class="kkey kkey-sp" style="flex:0 0 44px;">
            <svg width="18" height="14" viewBox="0 0 22 16" fill="none">
              <path d="M8 2H20C21.1 2 22 2.9 22 4V12C22 13.1 21.1 14 20 14H8L2 8L8 2Z"
                    stroke="#3C3C3E" stroke-width="1.5" fill="none"/>
              <line x1="10" y1="6" x2="16" y2="10" stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="16" y1="6" x2="10" y2="10" stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Row 4 : 한/영 / 스페이스 / return -->
        <div class="krow" style="gap:6px; margin-bottom:8px;">
          <button class="kkey kkey-sp" style="flex:0 0 86px; font-size:14px; letter-spacing:0; height:44px;">한/영</button>
          <button class="kkey" onclick="onKeyPress()" style="flex:1; font-size:15px; height:44px; color:#3C3C3E; letter-spacing:-0.3px;">스페이스</button>
          <button class="kkey kkey-sp" style="flex:0 0 86px; font-size:15px; letter-spacing:0; height:44px;">return</button>
        </div>

        <!-- 이모지 + 마이크 로우 (Figma: EmojiAndMic, h≈54px) -->
        <div style="display:flex; align-items:center; justify-content:space-between;
                    padding:2px 22px 6px; height:54px;">
          <!-- 이모지 버튼 -->
          <button style="width:36px; height:36px; background:none; border:none; cursor:pointer;
                         display:flex; align-items:center; justify-content:center; padding:0; outline:none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9.5" stroke="#3C3C3E" stroke-width="1.5"/>
              <circle cx="9"  cy="10.5" r="1.2" fill="#3C3C3E"/>
              <circle cx="15" cy="10.5" r="1.2" fill="#3C3C3E"/>
              <path d="M8.5 15C9.5 16.8 10.5 17.5 12 17.5C13.5 17.5 14.5 16.8 15.5 15"
                    stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- 마이크 버튼 -->
          <button style="width:36px; height:36px; background:none; border:none; cursor:pointer;
                         display:flex; align-items:center; justify-content:center; padding:0; outline:none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="2" width="6" height="11" rx="3" stroke="#3C3C3E" stroke-width="1.5"/>
              <path d="M5 11C5 15.418 8.134 19 12 19C15.866 19 19 15.418 19 11"
                    stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="12" y1="19" x2="12" y2="22" stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="9"  y1="22" x2="15" y2="22" stroke="#3C3C3E" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

      </div>
    </div><!-- /키보드 바텀 시트 -->

  </div><!-- /Rule 1 최상위 래퍼 -->
</div><!-- /screen-1 -->

</div><!-- /ut-stage -->
</div><!-- /frame -->

<script>
/* ── 프레임 크기 컨트롤 ── */
const frame = document.getElementById('frame');
const inpW  = document.getElementById('inp-w');
const inpH  = document.getElementById('inp-h');

document.querySelectorAll('#controls .preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls .preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    inpW.value = btn.dataset.w;
    inpH.value = btn.dataset.h;
    setFrameSize(btn.dataset.w, btn.dataset.h);
  });
});
document.getElementById('apply-btn').addEventListener('click', () => {
  setFrameSize(inpW.value, inpH.value);
});
function setFrameSize(w, h) {
  frame.style.width  = w + 'px';
  frame.style.height = h + 'px';
}

/* ── 화면 전환 (다음 화면 추가 시 사용) ── */
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── 키보드 바텀 시트 토글 ── */
function showKeyboard() {
  document.getElementById('s1-dim').classList.add('open');
  document.getElementById('s1-keyboard').classList.add('open');
  document.getElementById('s1-content').classList.add('keyboard-open');
}
function hideKeyboard() {
  document.getElementById('s1-dim').classList.remove('open');
  document.getElementById('s1-keyboard').classList.remove('open');
  document.getElementById('s1-content').classList.remove('keyboard-open');
  resetTyping();
}

/* ── 한글 키 입력 시 타이핑 상태 전환 (Figma 8908:10774) ── */
let isTyping = false;
function onKeyPress() {
  if (isTyping) return;
  isTyping = true;
  document.getElementById('s1-cursor-before').style.display = 'none';
  document.getElementById('s1-placeholder').style.display = 'none';
  document.getElementById('s1-typed').style.display = 'inline';
  document.getElementById('s1-cursor-after').style.display = 'inline-block';
}
function resetTyping() {
  isTyping = false;
  document.getElementById('s1-cursor-before').style.display = 'inline-block';
  document.getElementById('s1-placeholder').style.display = 'inline';
  document.getElementById('s1-typed').style.display = 'none';
  document.getElementById('s1-cursor-after').style.display = 'none';
}
</script>
</body>
</html>
