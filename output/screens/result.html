<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>SKT T Next UX — 옵션 AI 오퍼링</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── 컨트롤 바 ── */
  #controls .preset {
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid #d1d5db; background: #f9fafb;
    font-size: 12px; font-weight: 500; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  #controls .preset:hover  { background: #ede9fe; border-color: #8b5cf6; color: #5940df; }
  #controls .preset.active { background: #ede9fe; border-color: #5940df; color: #5940df; }
  #controls .ctrl-div { width: 1px; height: 20px; background: #e5e7eb; }
  #controls input[type=number] {
    width: 52px; padding: 3px 6px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; font-weight: 500; text-align: center; color: #374151; background: #f9fafb; outline: none;
  }
  #controls input[type=number]:focus { border-color: #5940df; }
  #controls input[type=number]::-webkit-inner-spin-button,
  #controls input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  #controls label { color: #6b7280; font-size: 12px; }
  #apply-btn {
    padding: 4px 12px; border-radius: 6px; border: none;
    background: #5940df; color: #fff; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  #apply-btn:hover { opacity: .85; }

  /* ── 반응형 ── */
  @media (max-width: 767px) {
    body { background: #f7f8fa; }
    #controls { display: none !important; }
    #frame { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
  }
  @media (min-width: 768px) {
    body {
      padding: 24px 0 48px; background: #d1d5db;
      display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100vh;
    }
    #controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    #frame { flex-shrink: 0; box-shadow: 0 24px 48px rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.12); }
  }

  /* ── 프레임 ── */
  #frame {
    position: relative; overflow: hidden;
    width: 375px; height: 812px; border-radius: 40px;
    margin: 0 auto; background: #f7f8fa;
  }
  #ut-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .screen { position: absolute; inset: 0; overflow: hidden; display: none; }
  .screen.active { display: block; }

  /* ── 화면: 옵션 AI 오퍼링 ── */
  #screen-result { background: #f7f8fa; }

  /* 헤더 (sticky, 66px) */
  #r-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    background: #f7f8fa;
    height: 66px;
    display: flex; align-items: center;
    padding: 20px;
  }
  .r-header-row {
    display: flex; align-items: center; gap: 8px; flex: 1;
  }
  .r-btn-back {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
  }
  .r-btn-back img { display: block; width: 24px; height: 24px; }

  /* 스크롤 영역: header(66px) ~ bottom(138px) */
  #r-scroll {
    position: absolute;
    top: 66px; bottom: 138px;
    left: 0; right: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #r-scroll::-webkit-scrollbar { display: none; }

  /* 하단 고정 영역 */
  #r-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 138px; z-index: 50;
  }
  #r-bottom-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(to top, #ffffff 70.979%, rgba(255,255,255,0) 100%);
    border-radius: 28px 28px 0 0;
    pointer-events: none;
  }
  #r-monthly-row {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px 16px;
  }
  .r-monthly-label {
    font-size: 14px; font-weight: 500; color: #101010;
    letter-spacing: -0.56px; line-height: 1.5; white-space: nowrap;
  }
  .r-monthly-amount {
    display: flex; align-items: center; gap: 4px;
  }
  .r-monthly-value {
    font-size: 15px; font-weight: 600; color: #000;
    letter-spacing: -1px; line-height: 26px; white-space: nowrap;
  }
  .r-chevron {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .r-chevron img { display: block; width: 12px; height: 7px; }

  #r-btn-row {
    position: relative;
    display: flex; gap: 8px; align-items: center;
    padding: 0 20px;
  }
  .r-btn {
    flex: 1; border-radius: 20px;
    padding: 16px 32px;
    font-size: 16px; font-weight: 600;
    letter-spacing: -0.64px; line-height: 1.3;
    text-align: center; cursor: pointer; min-width: 0;
  }
  .r-btn-outline { background: transparent; border: 1px solid #000; color: #222; }
  .r-btn-solid   { background: #000; border: none; color: #fff; }

  /* ── 콘텐츠 내부 ── */

  /* 타이틀 */
  .r-title-area { padding: 0 20px 20px; }
  .r-title-text {
    font-size: 18px; font-weight: 500;
    letter-spacing: -1.26px; line-height: 1.4;
    background: linear-gradient(to right, #2f2f2f 0%, #959595 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; color: transparent;
  }

  /* 섹션 공통: py-14 px-20 gap-10 */
  .r-section { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .r-section-title {
    font-size: 16px; font-weight: 500; color: #101010;
    letter-spacing: -0.8px; line-height: 1.4; white-space: nowrap;
  }

  /* 화이트 카드: rounded-16 py-20 px-14 */
  .r-card-white { background: #fff; border-radius: 16px; padding: 20px 14px; }

  /* 가입자 정보 */
  .r-subscriber-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    font-size: 14px; font-weight: 400; color: #101010;
    letter-spacing: -0.7px; line-height: 1.4; white-space: nowrap;
  }

  /* 주문 확인 카드: rounded-20 w-335 pt-21 pb-23 px-11 */
  .r-order-card {
    background: #fff; border-radius: 20px;
    width: 100%; padding: 21px 11px 23px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  /* 기기 정보: w-123 gap-11 */
  .r-device-info { width: 123px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .r-device-image { width: 100%; aspect-ratio: 49 / 48; overflow: hidden; }
  .r-device-image img { width: 100%; height: 100%; object-fit: cover; object-position: bottom; display: block; }
  /* 기기 메타: w-66 gap-4 */
  .r-device-meta { width: 66px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .r-device-name {
    font-size: 14px; font-weight: 600; color: #101010;
    letter-spacing: -0.56px; line-height: 1.2; width: 100%;
  }
  .r-device-spec { display: flex; gap: 4px; align-items: center; opacity: 0.4; width: 100%; }
  .r-device-spec span {
    font-size: 12px; font-weight: 400; color: #101010;
    letter-spacing: -0.48px; line-height: 1.2; white-space: nowrap;
  }
  .r-spec-div { width: 1px; height: 8px; background: #d9d9d9; flex-shrink: 0; }

  /* 세부 카드 묶음: gap-8 */
  .r-detail-cards { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  /* 세부 카드: bg-f6 rounded-12 p-12 gap-6 */
  .r-detail-card { background: #f6f6f6; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .r-detail-label {
    font-size: 12px; font-weight: 400; color: rgba(16,16,16,0.6);
    letter-spacing: -0.24px; line-height: 1.3;
  }
  /* 아이템 목록: gap-10 */
  .r-detail-items { display: flex; flex-direction: column; gap: 10px; }
  .r-row { display: flex; align-items: center; justify-content: space-between; }
  .r-row-end { display: flex; align-items: flex-end; justify-content: space-between; }
  .r-left { display: flex; align-items: center; gap: 8px; }

  /* 요금제 아이콘: 48×48 rounded-8 */
  .r-plan-icon { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .r-plan-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r-plan-info { flex: 1; display: flex; align-items: center; justify-content: space-between; padding-left: 8px; }
  .r-plan-name { font-size: 14px; font-weight: 400; color: #101010; letter-spacing: -0.56px; line-height: 1.2; white-space: nowrap; }
  .r-plan-price { font-size: 12px; font-weight: 400; color: #101010; letter-spacing: -0.24px; line-height: 1.3; white-space: nowrap; }

  /* 혜택 로고: 36×36 rounded-full */
  .r-benefit-logo { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .r-benefit-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r-benefit-name { font-size: 14px; font-weight: 500; color: #101010; letter-spacing: -0.56px; line-height: 1.2; white-space: nowrap; }
  .r-benefit-price { font-size: 12px; font-weight: 500; color: #101010; letter-spacing: -0.24px; line-height: 1.3; text-align: right; white-space: nowrap; min-width: 30px; }

  /* 부가서비스 */
  .r-addon-name { font-size: 14px; font-weight: 500; color: #101010; letter-spacing: -0.56px; line-height: 1.2; white-space: nowrap; }
  .r-addon-price { font-size: 12px; font-weight: 500; color: #101010; letter-spacing: -0.24px; line-height: 1.3; text-align: right; white-space: nowrap; }

  /* T 기프트 */
  .r-gift-card { background: #fff; border-radius: 16px; padding: 20px 14px; }
  .r-gift-inner { width: 100%; display: flex; align-items: center; gap: 12px; }
  /* 60×60 rounded-8 */
  .r-gift-image { width: 60px; height: 60px; border-radius: 8px; overflow: hidden; flex-shrink: 0; position: relative; }
  .r-gift-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r-gift-image::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(169,169,169,0.2); border-radius: 8px;
  }
  .r-gift-meta { display: flex; flex-direction: column; gap: 2px; }
  .r-gift-brand { font-size: 12px; font-weight: 400; color: #101010; letter-spacing: -0.6px; line-height: 1.4; white-space: nowrap; }
  .r-gift-name  { font-size: 14px; font-weight: 600; color: #101010; letter-spacing: -0.7px; line-height: 1.4; white-space: nowrap; }
</style>
</head>
<body>

<!-- 컨트롤 바 -->
<div id="controls">
  <button class="preset active" data-w="375" data-h="812">375×812</button>
  <button class="preset" data-w="390" data-h="844">390×844</button>
  <button class="preset" data-w="430" data-h="932">430×932</button>
  <div class="ctrl-div"></div>
  <label>W <input type="number" id="inp-w" value="375" min="320" max="430"></label>
  <label>H <input type="number" id="inp-h" value="812" min="667" max="932"></label>
  <button id="apply-btn">적용</button>
</div>

<!-- 프레임 -->
<div id="frame">
<div id="ut-stage">
<div class="screen active" id="screen-result">

  <!-- 헤더 -->
  <div id="r-header">
    <div class="r-header-row">
      <div class="r-btn-back">
        <img src="assets/ico-back.svg" alt="뒤로">
      </div>
    </div>
  </div>

  <!-- 스크롤 콘텐츠 -->
  <div id="r-scroll">

    <!-- 타이틀 -->
    <div class="r-title-area">
      <p class="r-title-text">모든 선택이 완료되었어요.<br>선택한 정보가 맞는지 마지막으로 확인해주세요.</p>
    </div>

    <!-- 가입자 정보 -->
    <div class="r-section">
      <div class="r-section-title">가입자 정보</div>
      <div class="r-card-white">
        <div class="r-subscriber-row">
          <span>김지훈</span>
          <span>010-1234-5678</span>
        </div>
      </div>
    </div>

    <!-- 주문 확인 -->
    <div class="r-section">
      <div class="r-section-title">주문 확인</div>
      <div class="r-order-card">

        <!-- 기기 -->
        <div class="r-device-info">
          <div class="r-device-image">
            <img src="assets/galaxy-s29.png" alt="갤럭시 S29">
          </div>
          <div class="r-device-meta">
            <div class="r-device-name">갤럭시 S29</div>
            <div class="r-device-spec">
              <span>블랙</span>
              <div class="r-spec-div"></div>
              <span>256GB</span>
            </div>
          </div>
        </div>

        <!-- 세부 카드 -->
        <div class="r-detail-cards">

          <!-- 요금제 -->
          <div class="r-detail-card">
            <div class="r-detail-label">요금제</div>
            <div class="r-row">
              <div class="r-plan-icon">
                <img src="assets/plan-icon.png" alt="요금제 아이콘">
              </div>
              <div class="r-plan-info">
                <span class="r-plan-name">5GX 프라임</span>
                <span class="r-plan-price">89,000원/월</span>
              </div>
            </div>
          </div>

          <!-- 혜택 -->
          <div class="r-detail-card">
            <div class="r-detail-label">혜택</div>
            <div class="r-detail-items">
              <div class="r-row">
                <div class="r-left">
                  <div class="r-benefit-logo"><img src="assets/benefit-br.png" alt="배스킨라빈스"></div>
                  <span class="r-benefit-name">월 1회 싱글레귤러 50% 할인</span>
                </div>
                <span class="r-benefit-price">+0원</span>
              </div>
              <div class="r-row">
                <div class="r-left">
                  <div class="r-benefit-logo"><img src="assets/benefit-chatgpt.png" alt="ChatGPT"></div>
                  <span class="r-benefit-name">ChatGPT Plus 이용권 구독</span>
                </div>
                <span class="r-benefit-price">+0원</span>
              </div>
            </div>
          </div>

          <!-- 부가서비스 -->
          <div class="r-detail-card">
            <div class="r-detail-label">부가서비스</div>
            <div class="r-detail-items">
              <div class="r-row-end">
                <span class="r-addon-name">분실파손6 고급(온라인)</span>
                <span class="r-addon-price">5,400원</span>
              </div>
              <div class="r-row-end">
                <span class="r-addon-name">해외주식노트</span>
                <span class="r-addon-price">5,500원</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- T 기프트 -->
    <div class="r-section">
      <div class="r-section-title">T 기프트</div>
      <div class="r-gift-card">
        <div class="r-gift-inner">
          <div class="r-gift-image">
            <img src="assets/galaxy-ring.png" alt="갤럭시 링 3">
          </div>
          <div class="r-gift-meta">
            <span class="r-gift-brand">삼성전자</span>
            <span class="r-gift-name">갤럭시 링 3</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 스크롤 여백 -->
    <div style="height: 16px;"></div>

  </div><!-- /r-scroll -->

  <!-- 하단 고정 -->
  <div id="r-bottom">
    <div id="r-bottom-gradient"></div>
    <div id="r-monthly-row">
      <span class="r-monthly-label">예상 월 납부 금액</span>
      <div class="r-monthly-amount">
        <span class="r-monthly-value">월 118,700원</span>
        <div class="r-chevron">
          <img src="assets/ico-chevron.svg" alt="">
        </div>
      </div>
    </div>
    <div id="r-btn-row">
      <button class="r-btn r-btn-outline" onclick="window.location.href='cart.html'">장바구니 담기</button>
      <button class="r-btn r-btn-solid">결제하기</button>
    </div>
  </div>

</div><!-- /screen-result -->
</div><!-- /ut-stage -->
</div><!-- /frame -->

<script>
const frame   = document.getElementById('frame');
const inpW    = document.getElementById('inp-w');
const inpH    = document.getElementById('inp-h');
const presets = document.querySelectorAll('#controls .preset');

presets.forEach(btn => {
  btn.addEventListener('click', () => {
    presets.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applySize(+btn.dataset.w, +btn.dataset.h);
    inpW.value = btn.dataset.w;
    inpH.value = btn.dataset.h;
  });
});

document.getElementById('apply-btn').addEventListener('click', () => {
  applySize(+inpW.value || 375, +inpH.value || 812);
  presets.forEach(b => b.classList.remove('active'));
});

function applySize(w, h) {
  frame.style.width        = w + 'px';
  frame.style.height       = h + 'px';
  frame.style.borderRadius = Math.round(w * 0.107) + 'px';
}

(function scaleFrame() {
  const BASE_W = 375, BASE_H = 812;
  function resize() {
    if (window.innerWidth < 768) return;
    const scale = Math.min(window.innerWidth * 0.9 / BASE_W, (window.innerHeight - 120) / BASE_H, 1.2);
    if (+inpW.value === BASE_W && +inpH.value === BASE_H) {
      frame.style.width        = BASE_W * scale + 'px';
      frame.style.height       = BASE_H * scale + 'px';
      frame.style.borderRadius = 40 * Math.min(scale, 1) + 'px';
    }
  }
  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
